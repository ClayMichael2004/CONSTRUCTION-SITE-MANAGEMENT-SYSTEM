<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Roles/Expertise</title>
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <style>
    .role-container {
      background: #fff;
      padding: 2rem;
      max-width: 600px;
      margin: 50px auto;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    h2 { text-align: center; color: #1f2937; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
    input { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc; font-size: 0.95rem; }
    button { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; background: #1f2937; color: white; font-size: 1rem; cursor: pointer; transition: background 0.3s ease; }
    button:hover { background: #111827; }
    .message { margin-top: 1rem; font-size: 0.9rem; text-align: center; }
    .error { color: red; }
    .success { color: green; }
    .back-link { display: block; margin-top: 1rem; text-align: center; text-decoration: none; color: #1f2937; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    table th, table td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    table th { background: #f3f4f6; }
    .actions button {
      padding: 6px 10px;
      font-size: 0.8rem;
      margin-right: 5px;
      border-radius: 4px;
    }
    .edit-btn { background-color: #2563eb; color: white; }
    .delete-btn { background-color: #dc2626; color: white; }
  </style>
</head>
<body>
  <div class="role-container">
    <h2>Manage Roles / Expertise</h2>
    <form id="roleForm">
      <div class="form-group">
        <label for="roleName">Role/Expertise</label>
        <input type="text" id="roleName" placeholder="e.g. Mason, Electrician" required>
      </div>
      <div class="form-group">
        <label for="amount">Amount Payable (Ksh)</label>
        <input type="number" id="amount" placeholder="Enter amount" required>
      </div>
      <button type="submit">Add Role</button>
      <div class="message" id="message"></div>
    </form>

    <a href="admin.html" class="back-link">⬅ Back to Dashboard</a>

    <h3>Existing Roles</h3>
    <table id="rolesTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Role/Expertise</th>
          <th>Amount (Ksh)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const messageDiv = document.getElementById("message");
    const roleForm = document.getElementById("roleForm");
    const roleNameInput = document.getElementById("roleName");
    const amountInput = document.getElementById("amount");
    const rolesTableBody = document.querySelector("#rolesTable tbody");

    // Redirect if not admin
    if (localStorage.getItem("role") !== "admin") {
      alert("Unauthorized access");
      window.location.href = "login.html";
    }

    // Load all roles
    async function loadRoles() {
      try {
        const res = await fetch("/api/roles", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const roles = await res.json();
        rolesTableBody.innerHTML = "";
        roles.forEach(role => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${role.id}</td>
            <td>${role.name}</td>
            <td>${role.amount}</td>
            <td class="actions">
              <button class="edit-btn" onclick="editRole(${role.id}, '${role.name}', ${role.amount})">Edit</button>
              <button class="delete-btn" onclick="deleteRole(${role.id})">Delete</button>
            </td>
          `;
          rolesTableBody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Add role
    roleForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = roleNameInput.value.trim();
      const amount = amountInput.value.trim();
      if (!name || !amount) return;

      try {
        const res = await fetch("/api/roles", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ name, amount })
        });
        const data = await res.json();
        if (!res.ok) {
          messageDiv.textContent = data.msg || "Failed to add role";
          messageDiv.className = "message error";
        } else {
          messageDiv.textContent = "Role added successfully!";
          messageDiv.className = "message success";
          roleNameInput.value = "";
          amountInput.value = "";
          loadRoles();
        }
      } catch (err) {
        messageDiv.textContent = "Server error";
        messageDiv.className = "message error";
      }
    });

    // Edit role
    async function editRole(id, currentName, currentAmount) {
      const newName = prompt("Edit Role/Expertise:", currentName);
      const newAmount = prompt("Edit Amount (Ksh):", currentAmount);
      if (!newName || !newAmount) return;

      try {
        const res = await fetch(`/api/roles/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ name: newName, amount: newAmount })
        });
        const data = await res.json();
        if (res.ok) loadRoles();
        else alert(data.msg || "Failed to update");
      } catch (err) {
        alert("Server error");
      }
    }

    // Delete role
    async function deleteRole(id) {
      if (!confirm("Are you sure you want to delete this role?")) return;
      try {
        const res = await fetch(`/api/roles/${id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (res.ok) loadRoles();
        else alert(data.msg || "Failed to delete");
      } catch (err) {
        alert("Server error");
      }
    }

    loadRoles();
  </script>
</body>
</html>
